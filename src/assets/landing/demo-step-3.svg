<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <!-- Fondo atenuado de editor con overlay -->
  <rect width="800" height="500" rx="20" fill="#0b1120"/>
  <rect width="800" height="500" rx="20" fill="#000000" fill-opacity="0.6"/>

  <!-- Modal Central de Exportación (ExportModal) -->
  <g transform="translate(190, 50)" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.8))">
    <!-- Contenedor del Modal -->
    <rect width="420" height="400" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <!-- Cabecera del Modal -->
    <rect x="24" y="24" width="40" height="40" rx="12" fill="#312e81"/>
    <!-- Ícono descarga -->
    <path d="M44 36v12m0 0l-4-4m4 4l4-4M36 52h16" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="42" font-size="14" font-family="sans-serif" font-weight="bold" fill="#ffffff">Exportar Currículum</text>
    <text x="76" y="58" font-size="10" font-family="sans-serif" fill="#94a3b8">Listo para postularte sin marcas de agua</text>

    <!-- Indicador de Peso Optimizado ATS -->
    <rect x="24" y="80" width="372" height="54" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="48" cy="107" r="12" fill="#064e3b"/>
    <text x="48" y="112" font-size="14" font-family="sans-serif" font-weight="bold" fill="#34d399" text-anchor="middle">✓</text>
    <text x="70" y="101" font-size="11" font-family="sans-serif" font-weight="bold" fill="#f8fafc">Peso estimado: 840 KB (Óptimo ATS)</text>
    <text x="70" y="118" font-size="9" font-family="sans-serif" fill="#94a3b8">Supera con creces el límite de 2MB de portales laborales</text>

    <!-- Opción 1: Descargar PDF Directo -->
    <rect x="24" y="150" width="372" height="60" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <rect x="40" y="166" width="28" height="28" rx="8" fill="#ef4444" fill-opacity="0.15"/>
    <text x="54" y="184" font-size="10" font-family="sans-serif" font-weight="bold" fill="#f87171" text-anchor="middle">PDF</text>
    <text x="80" y="177" font-size="12" font-family="sans-serif" font-weight="bold" fill="#ffffff">Descargar PDF A4 Vectorial</text>
    <text x="80" y="195" font-size="9" font-family="sans-serif" fill="#64748b">Texto seleccionable, nítido y 100% libre</text>
    <rect x="310" y="165" width="70" height="30" rx="8" fill="#4f46e5"/>
    <text x="345" y="184" font-size="10" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">Bajar PDF</text>

    <!-- Opción 2: Guardar en Google Drive -->
    <rect x="24" y="222" width="372" height="60" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <rect x="40" y="238" width="28" height="28" rx="8" fill="#0066da" fill-opacity="0.15"/>
    <!-- Logo Drive mini -->
    <circle cx="54" cy="252" r="8" fill="#0f172a"/>
    <text x="80" y="249" font-size="12" font-family="sans-serif" font-weight="bold" fill="#ffffff">Sincronizar en Google Drive</text>
    <text x="80" y="267" font-size="9" font-family="sans-serif" fill="#64748b">Guarda en tu carpeta 'CV Data' sin servidores</text>
    <rect x="310" y="237" width="70" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="345" y="256" font-size="10" font-family="sans-serif" font-weight="bold" fill="#cbd5e1" text-anchor="middle">Guardar</text>

    <!-- Opción 3: Exportar JSON -->
    <rect x="24" y="294" width="372" height="45" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="40" y="321" font-size="11" font-family="sans-serif" font-weight="bold" fill="#cbd5e1">Copia de respaldo JSON</text>
    <text x="345" y="321" font-size="10" font-family="sans-serif" font-weight="bold" fill="#818cf8" text-anchor="middle">Exportar JSON</text>

    <!-- Badge garantía -->
    <text x="210" y="372" font-size="10" font-family="sans-serif" fill="#64748b" text-anchor="middle">🔒 Tus datos nunca tocan ningún servidor externo</text>
  </g>
</svg>
