<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente ambiental de fondo -->
    <radialGradient id="heroAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Sombras de las hojas A4 -->
    <filter id="sheetShadowLeft" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <filter id="sheetShadowCenter" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="sheetShadowRight" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="6" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>

    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Halo de resplandor ambiental -->
  <circle cx="400" cy="300" r="280" fill="url(#heroAmbientGlow)"/>

  <!-- ==================== HOJA IZQUIERDA: Plantilla Clásica ==================== -->
  <g transform="translate(140, 90) rotate(-7 150 210)" filter="url(#sheetShadowLeft)">
    <!-- Lienzo A4 -->
    <rect width="280" height="396" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Cabecera Serif -->
    <rect x="30" y="32" width="130" height="12" rx="3" fill="#0f172a"/>
    <rect x="30" y="48" width="90" height="6" rx="2" fill="#64748b"/>
    <line x1="30" y1="62" x2="250" y2="62" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Resumen -->
    <rect x="30" y="74" width="220" height="4" rx="2" fill="#94a3b8"/>
    <rect x="30" y="82" width="200" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="30" y="90" width="160" height="4" rx="2" fill="#cbd5e1"/>
    <!-- Sección Experiencia -->
    <rect x="30" y="108" width="80" height="7" rx="2" fill="#1e293b"/>
    <line x1="30" y1="119" x2="250" y2="119" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="30" y="128" width="110" height="5" rx="2" fill="#334155"/>
    <rect x="210" y="128" width="40" height="5" rx="2" fill="#94a3b8"/>
    <rect x="30" y="137" width="210" height="3.5" rx="1.5" fill="#94a3b8"/>
    <rect x="30" y="144" width="190" height="3.5" rx="1.5" fill="#cbd5e1"/>
    <!-- Item 2 Experiencia -->
    <rect x="30" y="160" width="100" height="5" rx="2" fill="#334155"/>
    <rect x="210" y="160" width="40" height="5" rx="2" fill="#94a3b8"/>
    <rect x="30" y="169" width="200" height="3.5" rx="1.5" fill="#94a3b8"/>
    <rect x="30" y="176" width="180" height="3.5" rx="1.5" fill="#cbd5e1"/>
    <!-- Sección Educación -->
    <rect x="30" y="194" width="70" height="7" rx="2" fill="#1e293b"/>
    <line x1="30" y1="205" x2="250" y2="205" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="30" y="214" width="120" height="5" rx="2" fill="#334155"/>
    <rect x="30" y="223" width="170" height="3.5" rx="1.5" fill="#94a3b8"/>
    <!-- Badge plantilla -->
    <rect x="30" y="356" width="60" height="16" rx="8" fill="#f1f5f9"/>
    <text x="60" y="367" font-size="8" font-family="sans-serif" font-weight="bold" fill="#64748b" text-anchor="middle">CLÁSICA</text>
  </g>

  <!-- ==================== HOJA DERECHA: Plantilla Minimalista ==================== -->
  <g transform="translate(380, 95) rotate(7 150 210)" filter="url(#sheetShadowRight)">
    <!-- Lienzo A4 -->
    <rect width="280" height="396" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Cabecera Minimal -->
    <rect x="34" y="36" width="140" height="14" rx="3" fill="#0f172a"/>
    <rect x="34" y="56" width="80" height="6" rx="2" fill="#2563eb"/>
    <rect x="34" y="68" width="120" height="4" rx="2" fill="#94a3b8"/>
    <!-- Layout 2 columnas sutil -->
    <line x1="34" y1="84" x2="246" y2="84" stroke="#f1f5f9" stroke-width="1.5"/>
    <!-- Columna Izq Competencias -->
    <rect x="34" y="98" width="60" height="6" rx="2" fill="#0f172a"/>
    <rect x="34" y="110" width="55" height="4" rx="2" fill="#64748b"/>
    <rect x="34" y="118" width="48" height="4" rx="2" fill="#64748b"/>
    <rect x="34" y="126" width="52" height="4" rx="2" fill="#64748b"/>
    <!-- Columna Der Experiencia -->
    <rect x="110" y="98" width="90" height="6" rx="2" fill="#0f172a"/>
    <rect x="110" y="110" width="130" height="4" rx="2" fill="#334155"/>
    <rect x="110" y="118" width="120" height="3.5" rx="1.5" fill="#94a3b8"/>
    <rect x="110" y="125" width="115" height="3.5" rx="1.5" fill="#cbd5e1"/>
    <!-- Item 2 Der -->
    <rect x="110" y="142" width="125" height="4" rx="2" fill="#334155"/>
    <rect x="110" y="150" width="115" height="3.5" rx="1.5" fill="#94a3b8"/>
    <rect x="110" y="157" width="105" height="3.5" rx="1.5" fill="#cbd5e1"/>
    <!-- Badge plantilla -->
    <rect x="186" y="356" width="64" height="16" rx="8" fill="#f1f5f9"/>
    <text x="218" y="367" font-size="8" font-family="sans-serif" font-weight="bold" fill="#64748b" text-anchor="middle">MINIMAL</text>
  </g>

  <!-- ==================== HOJA CENTRAL: Plantilla Moderna (Elevada) ==================== -->
  <g transform="translate(255, 60)" filter="url(#sheetShadowCenter)">
    <!-- Lienzo A4 -->
    <rect width="290" height="410" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Franja superior de acento gradiente -->
    <path d="M0 16C0 7.16 7.16 0 16 0H274C282.84 0 290 7.16 290 16V48H0V16Z" fill="url(#headerGrad)"/>
    <!-- Foto circular simulada -->
    <circle cx="50" cy="52" r="22" fill="#ffffff" stroke="#e0e7ff" stroke-width="3"/>
    <circle cx="50" cy="52" r="18" fill="#c7d2fe"/>
    <!-- Nombre y Título en cabecera -->
    <rect x="84" y="56" width="120" height="12" rx="3" fill="#0f172a"/>
    <rect x="84" y="73" width="90" height="6" rx="2" fill="#4f46e5"/>
    <!-- Chips de contacto -->
    <rect x="30" y="96" width="65" height="12" rx="4" fill="#f1f5f9"/>
    <rect x="100" y="96" width="75" height="12" rx="4" fill="#f1f5f9"/>
    <rect x="180" y="96" width="80" height="12" rx="4" fill="#f1f5f9"/>
    <!-- Bloque de Perfil -->
    <rect x="30" y="122" width="70" height="7" rx="2" fill="#0f172a"/>
    <rect x="30" y="135" width="230" height="4" rx="2" fill="#64748b"/>
    <rect x="30" y="143" width="210" height="4" rx="2" fill="#94a3b8"/>
    <!-- Bloque Experiencia -->
    <rect x="30" y="162" width="95" height="7" rx="2" fill="#0f172a"/>
    <line x1="30" y1="174" x2="260" y2="174" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="30" y="184" width="120" height="6" rx="2" fill="#1e293b"/>
    <rect x="210" y="184" width="50" height="5" rx="2" fill="#6366f1"/>
    <rect x="30" y="195" width="225" height="4" rx="2" fill="#64748b"/>
    <rect x="30" y="203" width="195" height="4" rx="2" fill="#94a3b8"/>
    <!-- Item 2 Experiencia -->
    <rect x="30" y="219" width="110" height="6" rx="2" fill="#1e293b"/>
    <rect x="210" y="219" width="50" height="5" rx="2" fill="#94a3b8"/>
    <rect x="30" y="230" width="220" height="4" rx="2" fill="#64748b"/>
    <!-- Skills Chips -->
    <rect x="30" y="254" width="80" height="7" rx="2" fill="#0f172a"/>
    <rect x="30" y="268" width="50" height="12" rx="4" fill="#e0e7ff"/>
    <rect x="85" y="268" width="60" height="12" rx="4" fill="#e0e7ff"/>
    <rect x="150" y="268" width="45" height="12" rx="4" fill="#e0e7ff"/>
    <rect x="200" y="268" width="55" height="12" rx="4" fill="#e0e7ff"/>
    <!-- Badge Central Destacado -->
    <rect x="110" y="372" width="70" height="18" rx="9" fill="url(#headerGrad)"/>
    <text x="145" y="384" font-size="8.5" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">MODERNA</text>
  </g>
</svg>
