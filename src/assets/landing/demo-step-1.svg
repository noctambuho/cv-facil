<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <!-- Fondo ventana de editor -->
  <rect width="800" height="500" rx="20" fill="#0f172a"/>
  <!-- Barra superior mac-style -->
  <rect width="800" height="42" rx="20" fill="#1e293b"/>
  <circle cx="28" cy="21" r="5" fill="#f43f5e"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5" fill="#10b981"/>
  <rect x="300" y="14" width="200" height="14" rx="7" fill="#334155"/>
  <text x="400" y="24" font-size="9" font-family="sans-serif" font-weight="bold" fill="#94a3b8" text-anchor="middle">Paso 1: Completar Formulario</text>

  <!-- Split Screen Izquierda: Formulario -->
  <rect x="24" y="62" width="370" height="414" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Header sección perfil -->
  <rect x="46" y="84" width="140" height="14" rx="4" fill="#6366f1"/>
  <rect x="46" y="106" width="200" height="8" rx="3" fill="#64748b"/>

  <!-- Inputs simulados -->
  <rect x="46" y="128" width="155" height="32" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="58" y="148" font-size="10" font-family="sans-serif" fill="#94a3b8">Nombre completo</text>
  <rect x="215" y="128" width="155" height="32" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="227" y="148" font-size="10" font-family="sans-serif" fill="#94a3b8">Rol o profesión</text>

  <rect x="46" y="172" width="324" height="32" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="58" y="192" font-size="10" font-family="sans-serif" font-weight="bold" fill="#f8fafc">Senior Software Architect</text>
  <!-- Cursor parpadeante -->
  <line x1="205" y1="180" x2="205" y2="196" stroke="#6366f1" stroke-width="2"/>

  <!-- Experiencia laboral card -->
  <rect x="46" y="222" width="324" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="62" y="238" width="110" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="62" y="254" width="80" height="8" rx="2" fill="#64748b"/>
  <rect x="62" y="272" width="280" height="6" rx="2" fill="#475569"/>
  <rect x="62" y="284" width="250" height="6" rx="2" fill="#475569"/>
  <rect x="62" y="296" width="220" height="6" rx="2" fill="#475569"/>

  <!-- Botón Añadir -->
  <rect x="46" y="348" width="120" height="28" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="106" y="365" font-size="10" font-family="sans-serif" font-weight="bold" fill="#a5b4fc" text-anchor="middle">+ Añadir Experiencia</text>

  <!-- Split Screen Derecha: Previsualización en Vivo A4 -->
  <rect x="414" y="62" width="362" height="414" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
  <!-- Hoja A4 simulada centrada -->
  <rect x="465" y="80" width="260" height="375" rx="8" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))"/>
  <!-- Contenido en vivo -->
  <rect x="485" y="100" width="120" height="12" rx="3" fill="#0f172a"/>
  <rect x="485" y="116" width="100" height="6" rx="2" fill="#4f46e5"/>
  <line x1="485" y1="128" x2="705" y2="128" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="485" y="136" width="210" height="5" rx="2" fill="#64748b"/>
  <rect x="485" y="145" width="190" height="5" rx="2" fill="#94a3b8"/>
  <rect x="485" y="162" width="80" height="7" rx="2" fill="#1e293b"/>
  <rect x="485" y="174" width="220" height="4" rx="2" fill="#94a3b8"/>
  <rect x="485" y="182" width="200" height="4" rx="2" fill="#cbd5e1"/>
</svg>
